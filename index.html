<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小剛(謝育廷) 攝影專業名片 V1 </title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
    <script>
      const KANG_DATA = {
            LIFF_ID: "2008883499-yLpNwcHe",
            BASE_URL: "https://joannahsu0327-maker.github.io/mycard/",
            IMG_MAIN: "KANG_IMAGE.jpg",
            IMG_INTRO: "https://images.unsplash.com/photo-1554080353-a576cf803bda?auto=format&fit=crop&q=80&w=1000",
            name: "小剛 (謝育廷)",
            title: "商業攝影 | 視覺美學",
            intro: "捕捉妳最自然的瞬間，\n紀錄妳未曾察覺的光采。",
            
            // --- 這裡可以改標題與內容 ---
            feature_Title: "攝影服務項目", 
            item1: "📸 個人/品牌形象照",
            item2: "🎬 活動/講座紀實",
            item3: "👗 產品/型錄拍攝",
            item4: "✨ 風格修圖服務",
            // -----------------------

            url_Booking: "https://line.me/ti/p/XpVy9pGNLk",
            url_IG: "https://www.instagram.com/kang06231977",
            url_Web: "https://v3shot.com",
            phone: "0916270725"
        };

        async function main() {
            try {
                await liff.init({ liffId: KANG_DATA.LIFF_ID });
                if (!liff.isLoggedIn()) { liff.login(); return; }
                
                const ts = "?t=" + Date.now();
                await liff.shareTargetPicker([{
                    "type": "flex", 
                    "altText": "您好，這是 " + KANG_DATA.name + " 的攝影專業名片",
                    "contents": {
                        "type": "carousel",
                        "contents": [
                            { 
                                "type": "bubble", 
                                "hero": { "type": "image", "url": KANG_DATA.BASE_URL + KANG_DATA.IMG_MAIN + ts, "size": "full", "aspectRatio": "3:4", "aspectMode": "cover" }, 
                                "body": { "type": "box", "layout": "vertical", "contents": [ 
                                    { "type": "text", "text": KANG_DATA.name, "weight": "bold", "size": "xl" }, 
                                    { "type": "text", "text": KANG_DATA.title, "size": "sm", "color": "#fb966e", "weight": "bold" } 
                                ] } 
                            },
                            { 
                                "type": "bubble", 
                                "hero": { "type": "image", "url": KANG_DATA.IMG_INTRO, "size": "full", "aspectRatio": "20:13", "aspectMode": "cover" }, 
                                "body": { "type": "box", "layout": "vertical", "spacing": "lg", "contents": [
                                    { "type": "text", "text": KANG_DATA.intro, "size": "xs", "color": "#888888", "wrap": true },
                                    // 改成這一行：
                                    { "type": "text", "text": KANG_DATA.feature_Title, "weight": "bold", "size": "lg", "color": "#fb966e" },
                                    // 在程式碼中間找到這一段，改成這樣：
                                    { "type": "box", "layout": "vertical", "spacing": "sm", "contents": [
                                    { "type": "text", "text": KANG_DATA.item1, "size": "md", "weight": "bold" },
                                    { "type": "text", "text": KANG_DATA.item2, "size": "md", "weight": "bold" },
                                    { "type": "text", "text": KANG_DATA.item3, "size": "md", "weight": "bold" },
                                    { "type": "text", "text": KANG_DATA.item4, "size": "md", "weight": "bold" }
                                    ]}
                                ]},
                                "footer": { "type": "box", "layout": "vertical", "contents": [ 
                                    { "type": "button", "style": "primary", "color": "#fb966e", "action": { "type": "uri", "label": "預約拍攝諮詢", "uri": KANG_DATA.url_Booking } } 
                                ] }
                            },
                            { 
                                "type": "bubble", 
                                "body": { "type": "box", "layout": "vertical", "spacing": "md", "contents": [
                                    { "type": "text", "text": "與我聯繫", "weight": "bold", "size": "lg" }, { "type": "separator" },
                                    { "type": "box", "layout": "vertical", "spacing": "sm", "contents": [
                                        { "type": "button", "style": "primary", "color": "#fb966e", "action": { "type": "uri", "label": "撥打電話", "uri": "tel:" + KANG_DATA.phone } },
                                        { "type": "button", "style": "secondary", "color": "#EEEEEE", "action": { "type": "uri", "label": "加 LINE 好友", "uri": KANG_DATA.url_Booking } },
                                        { "type": "button", "style": "secondary", "color": "#FEE8F0", "action": { "type": "uri", "label": "追蹤 Instagram", "uri": KANG_DATA.url_IG } },
                                        { "type": "button", "style": "secondary", "color": "#E8F0FE", "action": { "type": "uri", "label": "官方網站 V3shot", "uri": KANG_DATA.url_Web } },
                                        { "type": "button", "style": "link", "height": "sm", "action": { "type": "uri", "label": "📤 分享攝影名片", "uri": "https://liff.line.me/" + KANG_DATA.LIFF_ID } }
                                    ]}
                                ]}
                            }
                        ]
                    }
                }]);
                liff.closeWindow();
            } catch (err) { console.error(err); }
        }
        main();
    </script>
</body>
</html>
